<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>New Era Tutors</title>
<link rel="preconnect" href="https://xgjhrhhurevvgzbaelcg.supabase.co" crossorigin>
<link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&family=IBM+Plex+Sans:wght@400;500;600;700&display=swap" rel="stylesheet" media="print" onload="this.media='all'">
<style>
:root{--navy:#0E1E3D;--navy2:#081326;--gold:#C6A24C;--gold2:#E4D2A3;--paper:#F7F4EC;--paper2:#EFEADB;--line:#E3DDCB;--ink:#1B1F27;--soft:#5B6270;--rust:#B25B3E;--sage:#5B8266;--card:#fff;--head:#0E1E3D;--shadow:0 12px 30px -18px rgba(14,30,61,.35)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
input,textarea,select,.sel{-webkit-user-select:text;user-select:text}
html{scroll-behavior:smooth}
body{margin:0;color:var(--ink);font-family:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;line-height:1.5;-webkit-font-smoothing:antialiased;
  background:radial-gradient(900px 420px at 95% -8%,rgba(198,162,74,.16),transparent 60%),radial-gradient(800px 460px at -10% 0%,rgba(14,30,61,.08),transparent 55%),var(--paper);background-attachment:fixed}
h1,h2,h3{font-family:Fraunces,Georgia,serif;color:var(--head);letter-spacing:-.01em;margin-top:0}
h1{font-size:clamp(30px,6.4vw,48px);line-height:1.08;font-weight:600;margin-bottom:14px}
h2{font-size:25px;margin-bottom:12px;font-weight:600}h3{font-size:17px;margin-bottom:8px;font-weight:600}
p{margin:0 0 10px}small{color:var(--soft)}a{color:var(--head);font-weight:600}
@keyframes fadeUp{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
@keyframes drift{0%,100%{transform:translate(0,0) scale(1)}50%{transform:translate(18px,-14px) scale(1.08)}}

/* layout */
.top{position:sticky;top:0;z-index:6;background:linear-gradient(135deg,var(--navy),var(--navy2));color:#fff;padding:12px 18px;display:flex;align-items:center;box-shadow:0 8px 20px -12px rgba(8,19,38,.7)}
.brand{display:flex;align-items:center;gap:10px;font-family:Fraunces,Georgia,serif;font-weight:600;font-size:18px;color:#fff}
.brand em{font-style:normal;color:var(--gold)}
.logo{width:34px;height:34px;border-radius:10px;background:rgba(198,162,74,.2);display:flex;align-items:center;justify-content:center;font-size:18px}
main{max-width:600px;margin:0 auto;padding:22px 18px 50px}
.shell .pane main{padding-bottom:50px}
.side{display:none}
.wrap{max-width:1040px;margin:0 auto;padding:0 20px}

/* cards */
.card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:18px;margin-bottom:14px;box-shadow:var(--shadow);animation:fadeUp .45s ease both;transition:transform .18s,border-color .18s,box-shadow .18s}
.card[style*="cursor:pointer"]:hover,.tile:hover{transform:translateY(-3px);border-color:var(--gold);box-shadow:0 18px 34px -18px rgba(14,30,61,.45)}
.card.navy{background:linear-gradient(145deg,var(--navy),var(--navy2));color:#fff;border:0;position:relative;overflow:hidden}
.card.navy h2,.card.navy h3{color:#fff}
.card.navy:before{content:"";position:absolute;right:-60px;top:-60px;width:200px;height:200px;border-radius:50%;background:radial-gradient(circle,rgba(198,162,74,.35),transparent 70%);animation:drift 9s ease-in-out infinite}
.card.navy>*{position:relative}
.card.navy>.blob2{position:absolute}
main>.card:nth-child(2){animation-delay:.04s}main>.card:nth-child(3){animation-delay:.08s}main>.card:nth-child(4){animation-delay:.12s}main>.card:nth-child(5){animation-delay:.16s}

/* forms */
label{display:block;font-size:13px;font-weight:600;color:var(--soft);margin-bottom:14px}
input,select,textarea{width:100%;padding:12px 14px;margin-top:6px;border:1.5px solid var(--line);border-radius:12px;font-size:15px;font-family:inherit;background:var(--card);color:var(--ink);transition:border-color .15s,box-shadow .15s}
input:focus,select:focus,textarea:focus{outline:0;border-color:var(--gold);box-shadow:0 0 0 4px rgba(198,162,74,.18)}
label.row{display:flex;gap:12px;align-items:center;font-weight:500;color:var(--ink);margin-bottom:9px;padding:12px 14px;border:1.5px solid var(--line);border-radius:12px;cursor:pointer;transition:border-color .15s,background .15s}
label.row:hover{border-color:var(--gold);background:#FBF8F0}
label.row input{width:auto;margin:0;accent-color:var(--head)}

/* buttons */
button{font-family:inherit;border:0;border-radius:12px;padding:12px 18px;font-size:15px;font-weight:600;cursor:pointer;color:#fff;background:linear-gradient(135deg,#1a3566,var(--navy));box-shadow:0 10px 20px -12px rgba(14,30,61,.8);transition:transform .15s,filter .15s,box-shadow .15s}
button:hover{transform:translateY(-1px);filter:brightness(1.07)}button:active{transform:none}
button.full{width:100%}
button.gold{background:linear-gradient(135deg,#d8b865,var(--gold));color:var(--navy2);box-shadow:0 10px 20px -12px rgba(150,115,30,.9)}
button.ghost{background:transparent;color:var(--head);border:1.5px solid var(--line);box-shadow:none}
button.ghost:hover{border-color:var(--gold);background:#FBF8F0}
button.bad{background:linear-gradient(135deg,#c56a4b,var(--rust));box-shadow:0 10px 20px -12px rgba(178,91,62,.9)}
button:disabled{opacity:.45;cursor:not-allowed;transform:none;filter:none}

/* bits */
.pill{display:inline-block;font-size:12px;font-weight:700;padding:3px 11px;border-radius:99px;background:var(--paper2);color:var(--head)}
.pill.g{background:#E4EEE4;color:var(--sage)}.pill.r{background:#F3E2DA;color:var(--rust)}
.msg{color:var(--rust);font-size:14px;min-height:20px;margin:6px 0}.ok{color:var(--sage)}
.sp{display:flex;gap:10px;margin-top:10px}.sp button{flex:1}
.tabs{display:flex;gap:8px;margin-bottom:14px;background:var(--paper2);padding:5px;border-radius:14px}
.tabs button{flex:1;background:transparent;color:var(--head);box-shadow:none;padding:10px}
.tabs button.on{background:var(--card);box-shadow:0 6px 14px -8px rgba(14,30,61,.5)}
.pills{display:flex;gap:6px;margin-bottom:14px;flex-wrap:wrap}
.pills button{padding:8px 14px;font-size:13px;background:var(--card);color:var(--head);border:1.5px solid var(--line);box-shadow:none}
.pills button.on{background:var(--navy);color:#fff;border-color:var(--head)}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.tile{margin:0!important;text-align:center;cursor:pointer;padding:20px 8px}
.tile div{font-size:30px;margin-bottom:4px}
.stats{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:14px}
.stat{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px;box-shadow:var(--shadow);animation:fadeUp .5s ease both}
.stat b{display:block;font-family:Fraunces,Georgia,serif;font-size:26px;color:var(--head);line-height:1.1}
.stat small{font-size:12px}
details summary{cursor:pointer;font-weight:600;color:var(--head);margin-bottom:10px}
details{border-bottom:1px solid var(--line);padding:12px 2px}
details p{color:var(--soft);margin:8px 0 0}

/* bottom navigation (phones) */
.nav{position:fixed;left:12px;right:12px;bottom:12px;display:flex;background:rgba(255,255,255,.94);backdrop-filter:blur(10px);border:1px solid var(--line);border-radius:22px;z-index:8;padding:6px;box-shadow:0 18px 40px -16px rgba(8,19,38,.55)}
.nav button{flex:1;background:none;color:var(--soft);border-radius:16px;padding:8px 2px 8px;font-size:11px;font-weight:600;box-shadow:none}
.nav button:hover{filter:none;transform:none;background:var(--paper)}
.nav button.on{color:var(--head);background:linear-gradient(180deg,#F5ECD2,#EDE0B8)}
.nav i{display:block;font-style:normal;font-size:20px;line-height:1.25}

/* landing page */
.hero{display:grid;gap:28px;padding-top:36px;padding-bottom:28px}
.lead{font-size:16px;color:var(--soft);max-width:520px}
.fine{font-size:12.5px;color:var(--soft);margin-top:18px}
.btn-row{display:flex;gap:12px;flex-wrap:wrap;margin-top:20px}
.section{padding-top:22px;padding-bottom:22px}
.section>h2{display:flex;align-items:center;gap:12px}
.section>h2:after{content:"";flex:1;height:1px;background:var(--line)}
.cgrid{display:grid;gap:12px;grid-template-columns:1fr}
.fc-wrap{perspective:1200px;height:310px;margin:12px 0;touch-action:pan-y;cursor:pointer;transition:transform .25s ease,opacity .25s ease}
.fc-inner{position:relative;width:100%;height:100%;transition:transform .6s cubic-bezier(.2,.8,.2,1);transform-style:preserve-3d}
.fc-inner.flipped{transform:rotateY(180deg)}
.fc-face{position:absolute;inset:0;border-radius:24px;backface-visibility:hidden;-webkit-backface-visibility:hidden;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:28px 24px;overflow:auto;box-shadow:0 22px 40px -22px rgba(14,30,61,.7)}
.fc-front{background:radial-gradient(circle at 85% 12%,rgba(56,189,248,.35),transparent 42%),linear-gradient(135deg,#0E1E3D,#1d3b73);color:#fff;border:1px solid rgba(56,189,248,.35)}
.fc-back{background:radial-gradient(circle at 15% 88%,rgba(255,255,255,.35),transparent 45%),linear-gradient(135deg,#d8b865,#B8934A);color:#0E1E3D;transform:rotateY(180deg)}
.fc-tag{font-size:11px;font-weight:700;letter-spacing:.14em;opacity:.8;margin-bottom:12px}
.fc-ring{width:62px;height:62px;border-radius:50%;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.fc-ring>span{width:46px;height:46px;border-radius:50%;background:var(--card);display:flex;align-items:center;justify-content:center;font-weight:700;font-size:13px}
.flip{perspective:900px;height:175px;cursor:pointer}
.flip-in{position:relative;width:100%;height:100%;transition:transform .55s;transform-style:preserve-3d}
.flip.flipped .flip-in{transform:rotateY(180deg)}
.face{overflow:auto;position:absolute;inset:0;border-radius:16px;padding:16px;backface-visibility:hidden;-webkit-backface-visibility:hidden;border:1px solid var(--line);background:var(--card);box-shadow:var(--shadow)}
.face.back{transform:rotateY(180deg);background:linear-gradient(145deg,var(--navy),var(--navy2));color:#fff;border:0}
.face.back ul{margin:8px 0 0;padding:0;list-style:none;font-size:13px}
.face.back li{margin-bottom:4px}.face.back li:before{content:"✓ ";color:var(--gold)}
.band{background:linear-gradient(145deg,var(--navy2),var(--navy));color:#fff;padding:34px 0;margin-top:20px}
.band h3{color:var(--gold)}.band p{color:rgba(247,244,236,.78);font-size:14px}
.band .tri{display:grid;gap:20px}
.optgrid{display:grid;gap:8px;grid-template-columns:1fr 1fr}
.opt{background:rgba(255,255,255,.1);border:1.5px solid transparent;color:#fff;text-align:left;box-shadow:none;border-radius:12px}
.footer{border-top:1px solid var(--line);padding:26px 20px;text-align:center;margin-top:20px}
.wa{display:inline-block;margin:4px;padding:7px 16px;border:1.5px solid var(--sage);border-radius:99px;color:var(--sage);text-decoration:none;font-size:13px}

table{width:100%;border-collapse:collapse;font-size:13px}
th,td{padding:9px 6px;text-align:center;border-top:1px solid var(--line);white-space:nowrap}
th{font-size:11px;color:var(--soft);border-top:0;background:var(--paper2)}
th:first-child,td:first-child{text-align:left;padding-left:10px}
/* prototype-style header navigation (phones) */
.hdr{margin:12px 12px 0;background:linear-gradient(145deg,var(--navy),var(--navy2));border-radius:20px;padding:14px 10px 6px;box-shadow:0 16px 34px -18px rgba(8,19,38,.7)}
.hdr-top{display:flex;align-items:center;padding:0 8px 12px}
.hdr-nav{display:flex;gap:4px;overflow-x:auto;padding-bottom:8px;scrollbar-width:none;-webkit-overflow-scrolling:touch}
.hdr-nav::-webkit-scrollbar{display:none}
.pill-nav{flex:none;display:flex;align-items:center;gap:8px;background:none;color:rgba(247,244,236,.82);box-shadow:none;border-radius:12px;padding:10px 14px;font-size:14px;font-weight:600;white-space:nowrap}
.pill-nav:hover{filter:none;transform:none;background:rgba(255,255,255,.08)}
.pill-nav.on{background:rgba(198,162,74,.17);color:var(--gold)}
.pill-nav i{font-style:normal;font-size:16px}
.hdr-out{display:block;background:none;color:rgba(247,244,236,.7);box-shadow:none;padding:8px 12px;font-size:13px;font-weight:500}
.hdr-out:hover{filter:none;transform:none;color:#fff}
/* prototype extras */
.divider{display:flex;align-items:center;gap:12px;margin:26px 0 14px}
.divider span{font-family:Fraunces,Georgia,serif;font-size:18px;font-weight:600;color:var(--head);white-space:nowrap}
.divider i{flex:1;height:1px;background:var(--line)}
.rv{opacity:0;transform:translateY(18px);transition:opacity .6s ease,transform .6s ease}.rv.in{opacity:1;transform:none}
.ticker{display:none;align-items:center;gap:10px;background:var(--card);border:1px solid var(--line);border-radius:99px;padding:8px 16px;box-shadow:var(--shadow);margin:14px 0;max-width:430px}
.ticker .tk{font-size:13px;transition:opacity .35s;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
@keyframes pulse{0%{box-shadow:0 0 0 0 rgba(91,130,102,.5)}100%{box-shadow:0 0 0 12px rgba(91,130,102,0)}}
.dot{width:8px;height:8px;border-radius:50%;background:var(--sage);flex-shrink:0;animation:pulse 1.6s ease-out infinite}
.dots:after{content:"";position:absolute;inset:0;pointer-events:none;background-image:radial-gradient(rgba(198,162,74,.35) 1px,transparent 1px);background-size:18px 18px;opacity:.45}
.blob2{position:absolute;left:-70px;bottom:-80px;width:230px;height:230px;border-radius:50%;background:radial-gradient(circle,rgba(255,255,255,.12),transparent 70%);animation:drift 11s ease-in-out infinite reverse;pointer-events:none}
.avatar{width:52px;height:52px;border-radius:50%;background:linear-gradient(135deg,var(--navy),var(--navy2));color:var(--gold);display:flex;align-items:center;justify-content:center;font-family:Fraunces,Georgia,serif;font-size:20px;font-weight:700;flex-shrink:0;object-fit:cover}
.chip{display:inline-flex;align-items:center;gap:6px;background:var(--card);border:1px solid var(--line);border-radius:99px;padding:8px 14px;font-size:13px;font-weight:600;color:var(--head);margin:0 8px 8px 0}
.ico{width:34px;height:34px;border-radius:10px;background:var(--paper2);display:flex;align-items:center;justify-content:center;font-size:17px;margin-bottom:8px}
.journey{display:flex;align-items:center;overflow-x:auto;padding-bottom:6px;margin-bottom:6px}
.jstep{display:flex;flex-direction:column;align-items:center;gap:5px;min-width:70px}
.jdot{width:28px;height:28px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:700;background:var(--line);color:var(--soft)}
.jdot.on{background:var(--gold);color:var(--navy2)}.jdot.now{box-shadow:0 0 0 4px rgba(198,162,74,.28)}
.jline{flex:1;height:2px;background:var(--line);min-width:14px;margin-bottom:18px}.jline.on{background:var(--gold)}
.jstep small{font-size:10.5px;white-space:nowrap}
.bell{position:relative;background:rgba(255,255,255,.12);box-shadow:none;padding:8px 11px;border-radius:12px;font-size:16px;margin-left:auto}
.bell b{position:absolute;top:4px;right:4px;width:9px;height:9px;border-radius:50%;background:var(--rust)}
.sheet{position:fixed;inset:0;background:rgba(8,19,38,.5);z-index:30;display:flex;justify-content:flex-end;align-items:flex-start;padding:12px}
.sheet>div{background:var(--card);border-radius:18px;width:min(380px,100%);max-height:80vh;overflow:auto;padding:16px;box-shadow:0 30px 60px -20px rgba(8,19,38,.6)}
.ring{width:78px;height:78px;border-radius:50%;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.ring div{width:60px;height:60px;border-radius:50%;background:var(--card);display:flex;align-items:center;justify-content:center;font-family:Fraunces,Georgia,serif;font-weight:700;color:var(--head);font-size:18px}
.titlebar{text-align:center;padding:30px 20px 0}
.titlebar .brand{justify-content:center;font-size:clamp(28px,6vw,42px);color:var(--head)}
.titlebar .logo{width:52px;height:52px;border-radius:14px;background:var(--navy);font-size:26px}
.titlebar .brand em{color:var(--gold)}

/* desktop: sidebar like the prototype */
@media(min-width:900px){
  .hero{grid-template-columns:1.15fr .85fr;align-items:center;padding-top:60px}
  .cgrid{grid-template-columns:1fr 1fr}.band .tri{grid-template-columns:repeat(3,1fr)}
  .stats{grid-template-columns:repeat(4,1fr)}
  .shell{display:grid;grid-template-columns:272px 1fr;min-height:100vh}
  .shell .top,.shell .nav,.shell .hdr{display:none}
  .side{display:flex;flex-direction:column;position:sticky;top:0;height:100vh;background:linear-gradient(190deg,var(--navy),var(--navy2));padding:24px 14px;overflow-y:auto}
  .side .brand{padding:0 10px 24px;font-size:19px}
  .side nav button{display:flex;align-items:center;gap:12px;width:100%;text-align:left;background:none;color:rgba(247,244,236,.82);border-radius:12px;padding:10px 12px;margin-bottom:3px;font-size:14px;font-weight:500;box-shadow:none}
  .side nav button:hover{background:rgba(255,255,255,.08);filter:none;transform:none}
  .side nav button.on{background:rgba(198,162,74,.18);color:var(--gold);font-weight:600}
  .side nav i{font-style:normal;font-size:17px;width:22px;text-align:center}
  .side .out{margin-top:auto;background:rgba(255,255,255,.08);box-shadow:none;color:#fff}
  .shell .pane main{max-width:880px;padding:36px 40px 70px}
}

.sk{height:96px;border-radius:18px;margin-bottom:14px;background:linear-gradient(90deg,var(--paper2) 25%,var(--card) 37%,var(--paper2) 63%);background-size:400% 100%;animation:shine 1.3s ease infinite}
@keyframes shine{0%{background-position:100% 50%}100%{background-position:0 50%}}
.modal{position:fixed;inset:0;background:rgba(8,19,38,.58);z-index:60;display:flex;align-items:center;justify-content:center;padding:18px}
.modal>div{background:var(--card);border-radius:22px;padding:24px;max-width:400px;width:100%;box-shadow:0 30px 70px -20px rgba(8,19,38,.7);animation:popin .25s ease both}
@keyframes popin{from{transform:scale(.92);opacity:0}to{transform:none;opacity:1}}
@keyframes fall{0%{transform:translateY(-20px) rotate(0);opacity:1}100%{transform:translateY(190px) rotate(300deg);opacity:0}}
.confetti{position:absolute;top:0;font-size:18px;animation:fall 1.9s ease-in forwards;pointer-events:none}
@media print{button,.top,.hdr,.side,.nav,.modal{display:none!important}body{background:#fff}.card{box-shadow:none;animation:none}}
/* dark mode */
body.dark{--paper:#07101f;--paper2:#132746;--card:#0e1d38;--line:rgba(255,255,255,.14);--ink:#ECE8DC;--soft:#9AA6BA;--head:#F0E6C8;--shadow:0 12px 30px -18px rgba(0,0,0,.75);color-scheme:dark}
body.dark .pill.g{background:#17301f}body.dark .pill.r{background:#3a2019}
body.dark [style*="#FBF8F0"],body.dark [style*="#FBF3DC"],body.dark [style*="#EFEADB"]{background:#16294a!important}
body.dark [style*="#F3E2DA"]{background:#3a2019!important}
body.dark [style*="#E4EEE4"]{background:#17301f!important}
body.dark label.row:hover,body.dark button.ghost:hover{background:#16294a}
body.dark .tabs button.on{background:#16294a}
.bub-me{background:linear-gradient(135deg,#0E1E3D,#1d3b73);color:#fff;box-shadow:0 4px 10px -6px rgba(14,30,61,.6)}.bub-you{background:var(--card);color:var(--ink);border:1px solid var(--line);border-left:3px solid var(--gold)}
body.dark .bub-me{background:linear-gradient(135deg,#24467f,#2f5aa8)}

/* ===== Voltage design layer: electric accents, circuit traces, formula marks (appearance only) ===== */
:root{--volt:#38BDF8;--volt2:#7DD3FC;--spark:linear-gradient(90deg,#C6A24C,#38BDF8)}
::selection{background:rgba(56,189,248,.3)}
*{scrollbar-width:thin;scrollbar-color:#C6A24C transparent}
body::before{content:"";position:fixed;inset:0;z-index:-1;pointer-events:none;opacity:.07;background-size:240px 240px;

const isoWeekKey = d => {
  const t = new Date(Date.UTC(d.getFullYear(), d.getMonth(), d.getDate()));
  t.setUTCDate(t.getUTCDate() + 4 - (t.getUTCDay() || 7));
  const wk = Math.ceil(((t - new Date(Date.UTC(t.getUTCFullYear(), 0, 1))) / 86400000 + 1) / 7);
  return t.getUTCFullYear() + "-W" + String(wk).padStart(2, "0");
};
const parseQuestions = text => {
  const out = [];
  let cur = null, last = null, lastOpt = 0, blank = true;
  const startRe = /^(?:Q(?:uestion)?\s*\d*\s*[:.)\-]\s*|\d{1,3}(?:[.:]\s+|\)\s*))(.+)$/i;
  const optRe = /^\(?([A-Da-d])\s*[).:\-]\s*(.+)$/;
  const ansRe = /^(?:correct\s+)?(?:answer|ans|option)\s*(?:is)?\s*[:\-=]?\s*\(?([A-Da-d])(?![a-z])/i;
  const expRe = /^(?:explanation|reason|rationale|solution|working|note)\s*[:\-]\s*(.*)$/i;
  const unmark = t => {
    let ok = false;
    t = t.replace(/\s*(?:\*+|✓|✔|\((?:correct|answer)\))\s*$/i, () => { ok = true; return ""; });
    return [t.trim(), ok];
  };
  const newQ = q => ({ q, opts: ["", "", "", ""], ans: null, exp: "" });
  const flush = () => { if (cur) out.push(cur); cur = null; };
  for (const raw of text.split(/\r?\n/)) {
    const line = raw.trim();
    if (!line || /^([-_=*])\1{2,}$/.test(line)) { blank = true; continue; }
    const wasBlank = blank; blank = false;
    let m;
    if ((m = line.match(startRe))) { flush(); cur = newQ(m[1]); last = "q"; continue; }
    if ((m = line.match(optRe))) {
      if (!cur) continue;
      const i = "ABCD".indexOf(m[1].toUpperCase());
      const [t, ok] = unmark(m[2]);
      cur.opts[i] = t; if (ok) cur.ans = i; last = "o"; lastOpt = i; continue;
    }
    if (cur && (m = line.match(ansRe))) { cur.ans = "ABCD".indexOf(m[1].toUpperCase()); last = "a"; continue; }
    if (cur && (m = line.match(expRe))) { cur.exp = m[1]; last = "e"; continue; }
    if (!cur) { cur = newQ(line); last = "q"; continue; }
    if (last === "q") cur.q += " " + line;
    else if (last === "o") {
      if (cur.opts.every(Boolean)) { flush(); cur = newQ(line); last = "q"; }
      else cur.opts[lastOpt] += " " + line;
    }
    else if (last === "e") {
      if (wasBlank) { flush(); cur = newQ(line); last = "q"; } else cur.exp += " " + line;
    }
    else { flush(); cur = newQ(line); last = "q"; }
  }
  flush();
  return out;
};

async function route() {

    linkError = ""; history.replaceState(null, "", location.pathname);
    return resetView("This reset link has expired or was already used. Enter your email to get a new one.");
  }
  if (recovering) return newPasswordView();
  const { data: { session } } = await db.auth.getSession();
  if (!session) { await ensureCourses(); return landingView(); }
  const meP = db.from("profiles").select("*").eq("id", session.user.id).single();
  let cachedRole = ""; try { cachedRole = localStorage.net_role || ""; } catch (e) {}
  if (cachedRole === "student") { try { getCore({ id: session.user.id }); } catch (e) {} }
  const [{ data: me, error }] = await Promise.all([meP, ensureCourses()]);
  if (error && error.code !== "PGRST116") {
    return show(shell(h("div", { class: "card" }, h("h3", {}, "Can’t reach the portal"), h("p", {}, "Check your internet connection and try again. You are still logged in."),
      h("button", { class: "full", onclick: route }, "Try again"))));
  }
  if (error || !me) { await db.auth.signOut(); return landingView(); }
  try { localStorage.net_role = me.role; } catch (e) {}
  if (me.role === "student" && me.blocked) return blockedView(me);
  if (me.role === "student") {
    try {
      const pend = JSON.parse(localStorage.net_pending_pay || "null");
      if (pend && pend.email === String(session.user.email || "").toLowerCase() && Array.isArray(pend.courses) && pend.courses.length) {
        const { count } = await db.from("payments").select("id", { count: "exact", head: true }).eq("student_id", me.id);
        if (!count) {
          const { error: pe } = await db.from("payments").insert({ student_id: me.id, course_codes: pend.courses, amount: sumPrice(pend.courses), reference: payCode(), status: "unpaid" });
          if (!pe) localStorage.removeItem("net_pending_pay");
        } else localStorage.removeItem("net_pending_pay");
      }
    } catch (e) {}
  }
  me.role === "student" ? studentView(me) : adminView(me);
}
db.auth.onAuthStateChange(ev => { if (ev === "PASSWORD_RECOVERY") { recovering = true; try { sessionStorage.net_recovery = "1"; } catch (e) {} newPasswordView(); } });
let coursesP = null;
const ensureCourses = () => coursesP || (coursesP = loadCourses());
async function loadCourses() {
  try {
    const { data } = await db.from("courses").select("*").eq("active", true).order("position");
    if (data && data.length) {
      Object.keys(COURSES).forEach(k => delete COURSES[k]);
      Object.keys(TOPICS).forEach(k => delete TOPICS[k]);
      COURSES["100L"] = []; COURSES["200L"] = [];
      data.forEach(c => { (COURSES[c.level] = COURSES[c.level] || []).push([c.code, c.name]); TOPICS[c.code] = c.topics || []; PRICES[c.code] = c.price; });
    }
  } catch (e) { /* the built-in course list is used */ }
}
ensureCourses(); route();
</script>
