<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>New Era Tutors</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<script src="https://cdn.jsdelivr.net/npm/mammoth@1.8.0/mammoth.browser.min.js"></script>
<style>
:root{--navy:#0E1E3D;--gold:#C6A24C;--paper:#F7F4EC;--line:#DCD5C2;--ink:#1B1F27;--soft:#5B6270;--rust:#B25B3E;--sage:#5B8266}
*{box-sizing:border-box}
body{margin:0;background:var(--paper);color:var(--ink);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;line-height:1.45}
.top{background:var(--navy);color:#fff;padding:14px 18px;display:flex;justify-content:space-between;align-items:center}
.top b{font-size:17px}.top span{color:var(--gold)}
main{max-width:560px;margin:0 auto;padding:18px}
.card{background:#fff;border:1px solid var(--line);border-radius:14px;padding:16px;margin-bottom:14px}
h2{font-size:20px;margin:0 0 10px;color:var(--navy)}h3{font-size:15px;margin:0 0 8px;color:var(--navy)}
label{display:block;font-size:13px;font-weight:600;color:var(--soft);margin-bottom:12px}
input,select{width:100%;padding:11px 12px;margin-top:5px;border:1px solid var(--line);border-radius:9px;font-size:15px;background:#fff}
label.row{display:flex;gap:10px;align-items:center;font-weight:500;color:var(--ink);margin-bottom:8px;padding:10px;border:1px solid var(--line);border-radius:9px}
label.row input{width:auto;margin:0}
button{border:0;border-radius:10px;padding:12px 16px;font-size:15px;font-weight:600;cursor:pointer;background:var(--navy);color:#fff}
button.full{width:100%}button.gold{background:var(--gold);color:var(--navy)}
button.ghost{background:none;border:1px solid var(--line);color:var(--soft)}button.bad{background:var(--rust)}
button:disabled{opacity:.5}
.tabs{display:flex;gap:8px;margin-bottom:14px}.tabs button{flex:1;background:#fff;color:var(--navy);border:1px solid var(--line)}
.tabs button.on{background:var(--navy);color:#fff}
.msg{color:var(--rust);font-size:14px;min-height:20px;margin:6px 0}.ok{color:var(--sage)}
.pill{display:inline-block;font-size:12px;font-weight:700;padding:3px 10px;border-radius:99px;background:#EFEADB;color:var(--navy)}
.pill.g{background:#E4EEE4;color:var(--sage)}.pill.r{background:#F3E2DA;color:var(--rust)}
.sp{display:flex;gap:8px;margin-top:10px}.sp button{flex:1}
.nav{position:fixed;bottom:0;left:0;right:0;display:flex;background:#fff;border-top:1px solid var(--line);z-index:5}
.nav button{flex:1;background:none;color:var(--soft);border-radius:0;padding:8px 2px 10px;font-size:11px;font-weight:600}
.nav button.on{color:var(--navy);background:#F7F4EC}
.nav i{display:block;font-style:normal;font-size:19px;line-height:1.2}
.pills{display:flex;gap:6px;margin-bottom:12px;flex-wrap:wrap}
.pills button{padding:7px 12px;font-size:13px;background:#fff;color:var(--navy);border:1px solid var(--line)}
.pills button.on{background:var(--navy);color:#fff}
textarea{font-family:inherit}
details summary{cursor:pointer;font-weight:600;color:var(--navy);margin-bottom:10px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.tile{margin:0!important;text-align:center;cursor:pointer;padding:16px 8px}
.tile div{font-size:26px}
small{color:var(--soft)}a{color:var(--navy);font-weight:600}
</style>
</head>
<body>
<div id="app"></div>
<script>
/* ---------- SETTINGS (edit these) ---------- */
const CONFIG = {
  url: "https://xgjhrhhurevvgzbaelcg.supabase.co",
  key: "sb_publishable_oLh6DpQTqLJp1sq472ccnQ_XCIz_kiK",   // public key: safe in a web page
  pricePerCourse: 4000,
  account: { bank: "Kuda", number: "2083125342", name: "Onikepe Faruk Olamilekan" },
  whatsapp: "2348161542738"
};
const COURSES = {
  "100L": [["MTH 101","Elementary Mathematics I"],["GST 101","Use of English & Comm. Skills"],["CHM 101","General Chemistry I"],["PHY 101","General Physics I"]],
  "200L": [["ECO 201","Intermediate Microeconomics"],["ACC 201","Financial Accounting I"],["STA 201","Statistics for Social Sciences"],["GST 201","Philosophy & Logic"]]
};

const db = supabase.createClient(CONFIG.url, CONFIG.key);
let recovering = location.hash.includes("type=recovery");
const app = document.getElementById("app");
const showErr = m => {
  let b = document.getElementById("errbar");
  if (!b) { b = h("div", { id: "errbar", style: "position:fixed;left:0;right:0;bottom:0;background:#B25B3E;color:#fff;padding:10px 14px;font-size:13px;z-index:9" }); document.body.append(b); }
  b.textContent = "Problem: " + m;
};
window.addEventListener("error", e => showErr(e.message));
window.addEventListener("unhandledrejection", e => showErr((e.reason && e.reason.message) || String(e.reason)));
const payCode = () => "NET-" + (1000 + Math.floor(Math.random() * 9000));
const naira = n => "₦" + n.toLocaleString("en-NG");
const h = (tag, attrs = {}, ...kids) => {
  const e = document.createElement(tag);
  for (const [k, v] of Object.entries(attrs)) {
    if (k.startsWith("on")) e.addEventListener(k.slice(2), v);
    else if (k === "class") e.className = v;
    else if (v !== false && v != null) e.setAttribute(k, v === true ? "" : v);
  }
  kids.flat().forEach(c => e.append(c instanceof Node ? c : document.createTextNode(c ?? "")));
  return e;
};
const shell = (...content) => h("div", {},
  h("div", { class: "top" }, h("b", {}, "New Era ", h("span", {}, "Tutors"))),
  h("main", {}, ...content));
const show = (...n) => app.replaceChildren(...n);
const navShell = (items, active, go, ...content) => h("div", {},
  h("div", { class: "top" }, h("b", {}, "New Era ", h("span", {}, "Tutors"))),
  h("main", { style: "padding-bottom:96px" }, ...content),
  h("nav", { class: "nav" }, ...items.map(([k, icon, label]) => h("button", { class: active === k ? "on" : "", onclick: () => go(k) }, h("i", {}, icon), label))));
const logoutBtn = () => h("button", { class: "ghost full", onclick: async () => {
  try { await Promise.race([db.auth.signOut({ scope: "local" }), new Promise(r => setTimeout(r, 2000))]); } catch (e) {}
  Object.keys(localStorage).filter(k => k.startsWith("sb-")).forEach(k => localStorage.removeItem(k));
  location.href = location.pathname;   // fresh start, nothing left stuck
} }, "Log out");
const waLink = text => h("a", { href: "https://wa.me/" + CONFIG.whatsapp, target: "_blank", rel: "noreferrer" }, text);

/* ---------- LOGIN / SIGN UP ---------- */
function authView(mode = "login") {
  const msg = h("p", { class: "msg" });
  const say = (t, good) => { msg.textContent = t; msg.className = "msg" + (good ? " ok" : ""); };
  const email = h("input", { type: "email", autocomplete: "email", placeholder: "you@example.com" });
  const pw = h("input", { type: "password", autocomplete: mode === "login" ? "current-password" : "new-password", placeholder: "At least 6 characters" });
  const tabs = h("div", { class: "tabs" },
    h("button", { class: mode === "login" ? "on" : "", onclick: () => authView("login") }, "Log in"),
    h("button", { class: mode === "signup" ? "on" : "", onclick: () => authView("signup") }, "Register"));

  if (mode === "login") {
    const btn = h("button", { class: "full" }, "Log in");
    btn.onclick = async () => {
      say(""); btn.disabled = true;
      const { error } = await db.auth.signInWithPassword({ email: email.value.trim(), password: pw.value });
      btn.disabled = false;
      if (error) return say("Wrong email or password.");
      route();
    };
    return show(shell(tabs, h("div", { class: "card" }, h("h2", {}, "Enter your portal"),
      h("label", {}, "Email", email), h("label", {}, "Password", pw), msg, btn),
      h("button", { class: "ghost full", onclick: () => resetView() }, "Forgot password?")));
  }

  const name = h("input", { type: "text", autocomplete: "name", placeholder: "e.g. Ada Lovelace" });
  const age = h("input", { type: "number", placeholder: "e.g. 17" });
  const total = h("b", {}, naira(0));
  const picked = new Set();
  const courseBox = h("div");
  const level = h("select", {}, h("option", { value: "100L" }, "100L — First year"), h("option", { value: "200L" }, "200L — Second year"));
  const draw = () => {
    picked.clear(); total.textContent = naira(0);
    courseBox.replaceChildren(...COURSES[level.value].map(([code, title]) => {
      const cb = h("input", { type: "checkbox" });
      cb.addEventListener("change", () => {
        cb.checked ? picked.add(code) : picked.delete(code);
        total.textContent = naira(picked.size * CONFIG.pricePerCourse);
      });
      return h("label", { class: "row" }, cb, code + " — " + title);
    }));
  };
  level.addEventListener("change", draw); draw();

  const btn = h("button", { class: "full gold" }, "Register & request approval");
  btn.onclick = async () => {
    say("");
    if (!name.value.trim()) return say("Enter your full name.");
    if (!/^\S+@\S+\.\S+$/.test(email.value.trim())) return say("Enter a valid email.");
    if (pw.value.length < 6) return say("Password must be at least 6 characters.");
    if (!age.value || age.value < 12 || age.value > 70) return say("Enter a valid age.");
    if (!picked.size) return say("Pick at least one course.");
    btn.disabled = true;
    const { data, error } = await db.auth.signUp({
      email: email.value.trim(), password: pw.value,
      options: { data: { full_name: name.value.trim(), level: level.value, age: age.value } }
    });
    if (error) { btn.disabled = false; return say(error.message); }
    let session = data.session;
    if (!session) {   // some projects still report "no session"; try signing in straight away
      const r = await db.auth.signInWithPassword({ email: email.value.trim(), password: pw.value });
      session = r.data?.session;
    }
    if (!session) { btn.disabled = false; return say("Account created. Confirm the email we sent you, then log in.", true); }
    const courses = [...picked];
    const { error: e2 } = await db.from("payments").insert({
      student_id: data.user.id, course_codes: courses,
      amount: courses.length * CONFIG.pricePerCourse, reference: payCode(), status: "unpaid"
    });
    if (e2) { btn.disabled = false; return say("Account created, but the payment request failed. Log in and tell a tutor."); }
    route();
  };
  show(shell(tabs, h("div", { class: "card" }, h("h2", {}, "Create your account"),
    h("label", {}, "Full name", name), h("label", {}, "Email", email), h("label", {}, "Password", pw),
    h("label", {}, "Age", age), h("label", {}, "Level", level),
    h("h3", {}, "Your courses"), courseBox,
    h("p", {}, "Total: ", total, "  ", h("small", {}, "(" + naira(CONFIG.pricePerCourse) + " per course)")),
    h("p", {}, h("small", {}, "After you register, you’ll see where to pay and your personal payment code.")), msg, btn)));
}

/* ---------- PASSWORD RESET ---------- */
const mkMsg = () => {
  const msg = h("p", { class: "msg" });
  return [msg, (t, good) => { msg.textContent = t; msg.className = "msg" + (good ? " ok" : ""); }];
};
function resetView() {
  const [msg, say] = mkMsg();
  const email = h("input", { type: "email", autocomplete: "email", placeholder: "you@example.com" });
  const btn = h("button", { class: "full" }, "Send reset link");
  btn.onclick = async () => {
    say("");
    if (!/^\S+@\S+\.\S+$/.test(email.value.trim())) return say("Enter the email you registered with.");
    btn.disabled = true;
    const { error } = await db.auth.resetPasswordForEmail(email.value.trim(), { redirectTo: location.origin + location.pathname });
    btn.disabled = false;
    if (error) return say(error.message);
    say("If that email is registered, a reset link is on its way. Check your inbox and spam folder.", true);
  };
  show(shell(h("div", { class: "card" }, h("h2", {}, "Reset your password"), h("label", {}, "Email", email), msg, btn),
    h("button", { class: "ghost full", onclick: () => authView("login") }, "Back to log in")));
}
function newPasswordView() {
  const [msg, say] = mkMsg();
  const pw = h("input", { type: "password", autocomplete: "new-password", placeholder: "At least 6 characters" });
  const btn = h("button", { class: "full gold" }, "Save new password");
  btn.onclick = async () => {
    say("");
    if (pw.value.length < 6) return say("Password must be at least 6 characters.");
    btn.disabled = true;
    const { error } = await db.auth.updateUser({ password: pw.value });
    if (error) { btn.disabled = false; return say(error.message); }
    recovering = false;
    history.replaceState(null, "", location.pathname);
    route();
  };
  show(shell(h("div", { class: "card" }, h("h2", {}, "Choose a new password"), h("label", {}, "New password", pw), msg, btn)));
}

/* ---------- STUDENT ---------- */
async function studentView(me, tab = "home", opt = {}) {
  clearInterval(window.__timer);
  const payBox = p => {
    const wa = "https://wa.me/" + CONFIG.whatsapp + "?text=" + encodeURIComponent("Hello, I have paid " + naira(p.amount) + " for " + p.course_codes.join(", ") + ". Name: " + me.full_name + ". Payment code: " + (p.reference || "") + ". My receipt is attached.");
    const details = [
      h("p", {}, "Send ", h("b", {}, naira(p.amount)), " to:"),
      h("p", {}, h("b", {}, CONFIG.account.bank + " · " + CONFIG.account.number), h("br"), CONFIG.account.name),
      h("p", {}, "Your payment code: ", h("b", {}, p.reference || ""))
    ];
    const rules = h("p", {}, h("b", {}, "You must"), " write this code in the transfer description, and send your receipt (screenshot) on WhatsApp to ", h("b", {}, "0816 154 2738"), ". Payments without the code and the receipt will not be approved.");
    if (p.status === "unpaid") {
      const btn = h("button", { class: "full gold" }, "I’ve made the transfer");
      btn.onclick = async () => {
        btn.disabled = true;
        const { data, error } = await db.from("payments").update({ status: "pending" }).eq("id", p.id).select();
        if (error || !data?.length) { btn.disabled = false; return alert("Could not update. Please try again."); }
        studentView(me);
      };
      return h("div", { class: "card", style: "border-color:#C6A24C" }, h("h3", {}, "Step 1: make your payment"), ...details, rules, btn);
    }
    return h("div", { class: "card", style: "border-color:#C6A24C" }, h("h3", {}, "Step 2: send your receipt"),
      h("p", {}, "Your payment is waiting for a tutor to confirm it. Send your receipt on WhatsApp now so it can be approved faster."),
      ...details, h("a", { href: wa, target: "_blank", rel: "noreferrer" }, "Send receipt on WhatsApp"));
  };
  const [en, pay, sc, ann, att, cs] = await Promise.all([
    db.from("enrollments").select("course_code").eq("student_id", me.id).eq("status", "active"),
    db.from("payments").select("*").eq("student_id", me.id).order("created_at", { ascending: false }),
    db.from("scores").select("course_code,week_key,score").eq("student_id", me.id).order("week_key", { ascending: false }),
    db.from("announcements").select("*").order("created_at", { ascending: false }).limit(10),
    db.from("attendance").select("course_code,session_date,present").eq("student_id", me.id).order("session_date"),
    db.from("class_scores").select("course_code,week_key,score").eq("student_id", me.id).order("week_key", { ascending: false })
  ]);
  const active = (en.data || []).map(x => x.course_code);
  const myAnn = (ann.data || []).filter(a => a.target === "All" || a.target === me.level);
  const annCards = myAnn.length ? [h("div", { class: "card" }, h("h3", {}, "Announcements"),
    ...myAnn.slice(0, 5).map(a => h("p", {}, a.urgent ? h("span", { class: "pill r" }, "Urgent") : "", a.urgent ? " " : "", a.text, h("br"),
      h("small", {}, a.category + " · " + new Date(a.created_at).toLocaleDateString("en-GB")))))] : [];
  const csBy = {};
  (cs.data || []).forEach(r => { (csBy[r.course_code] = csBy[r.course_code] || []).push(r); });
  const classCard = h("div", { class: "card" }, h("h3", {}, "Class test scores"), h("small", {}, "Marks from your tutors’ weekly tests in class."),
    ...(Object.keys(csBy).length ? Object.entries(csBy).map(([c, rows]) => h("div", { style: "margin-top:10px" },
      h("b", {}, c + " · average " + Math.round(rows.reduce((a, r) => a + r.score, 0) / rows.length) + "%"),
      ...rows.map(r => h("p", { style: "margin:4px 0" }, r.score + "%  ", h("small", {}, r.week_key.replace("-W", " · Week "))))))
      : [h("p", {}, "No class test scores yet.")]));
  const taken = new Set([...active, ...(pay.data || []).filter(p => p.status === "unpaid" || p.status === "pending").flatMap(p => p.course_codes)]);
  const available = (COURSES[me.level] || []).filter(([c]) => !taken.has(c));
  const addCard = active.length && available.length ? addCourseCard(me, available) : "";
  const attBy = {};
  (att.data || []).forEach(r => { (attBy[r.course_code] = attBy[r.course_code] || []).push(r.present); });
  const attCard = active.length ? h("div", { class: "card" }, h("h3", {}, "Attendance"),
    ...active.map(c => {
      const log = attBy[c] || [];
      let streak = 0;
      for (let i = log.length - 1; i >= 0 && log[i]; i--) streak++;
      return h("p", {}, h("b", {}, c), "  " + (log.length ? log.filter(Boolean).length + " of " + log.length + " sessions" + (streak > 1 ? " · " + streak + " in a row" : "") : "no sessions yet"));
    })) : "";
  const pills = { unpaid: ["Awaiting your payment", ""], pending: ["Waiting for approval", ""], approved: ["Approved", "g"], rejected: ["Rejected", "r"] };
  const first = me.full_name.split(" ")[0];
  const go = k => studentView(me, k);
  const items = [["home", "🏠", "Home"], ["tests", "📝", "Tests"], ["chat", "💬", "Chat"], ["profile", "👤", "Profile"], ["menu", "☰", "Menu"]];
  const menuKeys = ["menu", "progress", "mistakes", "flashcards", "leaderboard", "materials", "timer", "feedback", "payments"];
  const payBoxes = (pay.data || []).filter(p => p.status === "unpaid" || p.status === "pending").map(payBox);
  const scoreCard = h("div", { class: "card" }, h("h3", {}, "Online test scores"),
    (sc.data || []).length ? sc.data.map(x => h("p", {}, h("b", {}, x.score + "%"), "  " + x.course_code + " · " + x.week_key.replace("-W", " · Week ")))
      : h("p", {}, "No scores yet. Take a test to get your first one."));
  let body = [];
  if (tab === "home") {
    body = [h("div", { class: "card" }, h("h2", {}, "Welcome, " + first),
        h("p", {}, "Student ID: ", h("b", {}, me.matric || "given after your payment is approved"), h("br"), me.level)),
      ...payBoxes, ...annCards,
      h("div", { class: "card" }, h("h3", {}, "Your courses"),
        active.length ? active.map(c => h("p", {}, "✓ " + c)) : h("p", {}, "No active courses yet. Your portal opens as soon as a tutor confirms your payment."),
        active.length ? h("div", { class: "sp" }, h("button", { onclick: () => go("tests") }, "Take a test"), h("button", { class: "ghost", onclick: () => go("chat") }, "Message a tutor")) : "")];
  } else if (tab === "tests") {
    body = [h("h2", {}, "Tests"),
      h("div", { class: "card" }, h("h3", {}, "Weekly tests"),
        active.length ? active.map(c => h("div", { class: "sp" }, h("p", { style: "flex:2;margin:8px 0" }, c), h("button", { onclick: () => testView(me, c) }, "Take test")))
          : h("p", {}, "Your tests open once your payment is approved."),
        active.length ? h("button", { class: "gold full", style: "margin-top:10px", onclick: () => testView(me, "Weekly Challenge") }, "Weekly Challenge (practice)") : ""),
      scoreCard];
  } else if (tab === "menu") {
    const tiles = [["progress", "📊", "My Scores"], ["mistakes", "🎯", "Mistake Bank"], ["flashcards", "🗂️", "Flashcards"], ["leaderboard", "🏆", "Leaderboard"],
      ["materials", "📚", "Materials"], ["timer", "⏱️", "Focus Timer"], ["feedback", "💬", "Feedback"], ["payments", "💳", "Payments"]];
    body = [h("h2", {}, "Menu"), h("div", { class: "grid2" }, ...tiles.map(([k, icon, l]) => h("div", { class: "card tile", onclick: () => go(k) }, h("div", {}, icon), h("b", {}, l))))];
  } else if (tab === "progress") {
    body = [backTo(go), h("h2", {}, "My Scores"), scoreCard, classCard, attCard];
  } else if (tab === "mistakes") { body = await mistakesSection(me, go);
  } else if (tab === "flashcards") { body = await flashSection(me, go);
  } else if (tab === "leaderboard") { body = await leaderSection(me, go, active);
  } else if (tab === "materials") { body = await materialsSection(me, go);
  } else if (tab === "timer") { body = timerSection(go);
  } else if (tab === "feedback") { body = feedbackSection(me, go);
  } else if (tab === "payments") { body = paymentsSection(me, go, { pay: pay.data || [], addCard, pills });
  } else if (tab === "chat") {
    if (opt.tutor) {
      body = [h("button", { class: "ghost", style: "margin-bottom:12px", onclick: () => go("chat") }, "← All tutors"),
        chatBox(me.id, me, "student", "Chat with " + opt.tutor.full_name, opt.tutor.id)];
    } else {
      const { data: tutors, error } = await db.rpc("get_tutors");
      body = [h("h2", {}, "Chat"), h("p", {}, h("small", {}, "Choose a tutor to message. The conversation can be seen by you, that tutor and the school owner.")),
        ...(tutors && tutors.length ? tutors.map(t => h("div", { class: "card", style: "cursor:pointer", onclick: () => studentView(me, "chat", { tutor: t }) },
          h("h3", { style: "margin:0" }, t.full_name), h("small", {}, t.role === "owner" ? "Owner" : "Tutor")))
          : [h("div", { class: "card" }, h("p", {}, error ? error.message : "No tutors are available yet."))])];
    }
  } else if (tab === "profile") {
    body = [h("h2", {}, "Profile"),
      h("div", { class: "card", style: "background:linear-gradient(135deg,#0E1E3D,#081326);color:#fff;border:0" },
        h("small", { style: "color:#E4D2A3;letter-spacing:1px" }, "NEW ERA TUTORS · OFFICIAL STUDENT ID"),
        h("h2", { style: "color:#fff;margin:10px 0 2px" }, me.full_name), h("p", { style: "margin:0;color:#E4D2A3" }, me.matric || "ID given after approval"),
        h("p", { style: "margin:8px 0 0" }, me.level + " · " + active.length + " course" + (active.length === 1 ? "" : "s") + (active.length ? ": " + active.join(", ") : ""))),
      (pay.data || []).some(p => p.status === "rejected") ? h("div", { class: "card" }, h("p", {}, "A payment was rejected. Please ", waLink("message us on WhatsApp"), ".")) : "",
      addCard,
      h("button", { class: "ghost full", style: "margin-bottom:10px", onclick: () => go("payments") }, "Payments and receipts"),
      logoutBtn()];
  }

const isoWeekKey = d => {
  const t = new Date(Date.UTC(d.getFullYear(), d.getMonth(), d.getDate()));
  t.setUTCDate(t.getUTCDate() + 4 - (t.getUTCDay() || 7));
  const wk = Math.ceil(((t - new Date(Date.UTC(t.getUTCFullYear(), 0, 1))) / 86400000 + 1) / 7);
  return t.getUTCFullYear() + "-W" + String(wk).padStart(2, "0");
};
const parseQuestions = text => {
  const out = [];
  let cur = null, last = null, lastOpt = 0, blank = true;
  const startRe = /^(?:Q(?:uestion)?\s*\d*\s*[:.)\-]\s*|\d{1,3}(?:[.:]\s+|\)\s*))(.+)$/i;
  const optRe = /^\(?([A-Da-d])\s*[).:\-]\s*(.+)$/;
  const ansRe = /^(?:correct\s+)?(?:answer|ans|option)\s*(?:is)?\s*[:\-=]?\s*\(?([A-Da-d])(?![a-z])/i;
  const expRe = /^(?:explanation|reason|rationale|solution|working|note)\s*[:\-]\s*(.*)$/i;
  const unmark = t => {
    let ok = false;
    t = t.replace(/\s*(?:\*+|✓|✔|\((?:correct|answer)\))\s*$/i, () => { ok = true; return ""; });
    return [t.trim(), ok];
  };
  const newQ = q => ({ q, opts: ["", "", "", ""], ans: null, exp: "" });
  const flush = () => { if (cur) out.push(cur); cur = null; };
  for (const raw of text.split(/\r?\n/)) {
    const line = raw.trim();
    if (!line || /^([-_=*])\1{2,}$/.test(line)) { blank = true; continue; }
    const wasBlank = blank; blank = false;
    let m;
    if ((m = line.match(startRe))) { flush(); cur = newQ(m[1]); last = "q"; continue; }
    if ((m = line.match(optRe))) {
      if (!cur) continue;
      const i = "ABCD".indexOf(m[1].toUpperCase());
      const [t, ok] = unmark(m[2]);
      cur.opts[i] = t; if (ok) cur.ans = i; last = "o"; lastOpt = i; continue;
    }
    if (cur && (m = line.match(ansRe))) { cur.ans = "ABCD".indexOf(m[1].toUpperCase()); last = "a"; continue; }
    if (cur && (m = line.match(expRe))) { cur.exp = m[1]; last = "e"; continue; }
    if (!cur) { cur = newQ(line); last = "q"; continue; }
    if (last === "q") cur.q += " " + line;
    else if (last === "o") {
      if (cur.opts.every(Boolean)) { flush(); cur = newQ(line); last = "q"; }
      else cur.opts[lastOpt] += " " + line;
    }
    else if (last === "e") {
      if (wasBlank) { flush(); cur = newQ(line); last = "q"; } else cur.exp += " " + line;
    }
    else { flush(); cur = newQ(line); last = "q"; }
  }
  flush();
  return out;
};

  if (tab === "home") {
    const [pendR, studR, msgR] = await Promise.all([
      db.from("payments").select("*, profiles!payments_student_id_fkey(full_name,matric,level)").eq("status", "pending").order("created_at"),
      db.from("profiles").select("id", { count: "exact", head: true }).eq("role", "student"),
      db.from("messages").select("student_id,tutor_id,sender_role,created_at").order("created_at", { ascending: false }).limit(300)]);
    const pend = pendR.data || [];
    const needReply = threadsOf(msgR.data).filter(m => m.sender_role === "student").length;
    const stat = (n, label, fn) => h("div", { class: "card", style: "flex:1;text-align:center;margin:0 4px 14px;cursor:pointer;padding:12px 6px", onclick: fn }, h("h2", { style: "margin:0" }, String(n)), h("small", {}, label));
    const act = fn => async ev => {
      const b = ev.target; b.disabled = true;
      const { error } = await fn();
      if (error) { b.disabled = false; return alert("Failed: " + error.message); }
      adminView(me, "home");
    };
    const rows = pend.map(p => h("div", { class: "card" },
      h("h3", {}, p.profiles?.full_name + " · " + p.profiles?.level),
      h("p", {}, p.profiles?.matric || "New student (ID given on approval)", h("br"), p.course_codes.join(", ") + " — " + naira(p.amount),
        p.reference ? h("br") : "", p.reference ? h("b", {}, "Payment code: " + p.reference) : ""),
      h("div", { class: "sp" },
        h("button", { class: "gold", onclick: act(() => db.rpc("approve_payment", { pid: p.id })) }, "Approve"),
        h("button", { class: "bad", onclick: act(() => db.from("payments").update({ status: "rejected", reviewed_by: me.id, reviewed_at: new Date().toISOString() }).eq("id", p.id)) }, "Reject"))));
    body = [h("h2", {}, "Hello, " + me.full_name.split(" ")[0]),
      h("div", { style: "display:flex;margin:0 -4px" }, stat(studR.count ?? 0, "students", () => go("students")), stat(pend.length, "payments waiting", () => {}), stat(needReply, "need a reply", () => go("chat"))),
      h("h3", {}, "Payments waiting for approval (" + pend.length + ")"),
      ...(rows.length ? rows : [h("div", { class: "card" }, h("p", {}, "Nothing waiting."))])];
  } else if (tab === "students") {
    const [{ data: studs }, { data: staff }] = await Promise.all([
      db.from("profiles").select("id,full_name,matric,level").eq("role", "student").order("created_at", { ascending: false }),
      db.from("profiles").select("id,full_name,role").in("role", ["tutor", "owner"]).order("full_name")]);
    const setRole = async (id, role, ask) => {
      if (!confirm(ask)) return;
      const { error } = await db.from("profiles").update({ role }).eq("id", id);
      if (error) return alert("Failed: " + error.message);
      adminView(me, "students");
    };
    const small = { class: "ghost", style: "padding:4px 10px;font-size:13px" };
    body = [h("h2", {}, "Students"),
      h("div", { class: "card" }, h("h3", {}, "Tutors and owners (" + (staff || []).length + ")"),
        ...(staff || []).map(x => h("p", {}, x.full_name + " · ", h("span", { class: "pill" }, x.role === "owner" ? "Owner" : "Tutor"), " ",
          owner && x.role === "tutor" ? h("button", { ...small, onclick: () => setRole(x.id, "student", "Remove " + x.full_name + " as a tutor? They will lose admin access.") }, "Remove tutor") : "")),
        owner ? h("small", {}, "To add a tutor, ask them to register on the site, then tap Make tutor next to their name below.") : ""),
      h("div", { class: "card" }, h("h3", {}, "All students (" + (studs || []).length + ")"),
        (studs || []).length ? studs.map(x => h("p", {}, x.full_name + " · " + x.level + " · ", h("small", {}, x.matric || "no ID yet"), " ",
          h("button", { ...small, onclick: () => adminThread(me, { id: x.id, name: x.full_name, tutorId: me.id }) }, "Message"), " ",
          owner ? h("button", { ...small, onclick: () => setRole(x.id, "tutor", "Make " + x.full_name + " a tutor? They will get full admin access to payments, scores and messages.") }, "Make tutor") : ""))
          : h("p", {}, "None yet."))];
  } else if (tab === "teach") {
    const sub = opt.sub || "questions";
    const pills = h("div", { class: "pills" }, ...[["questions", "Questions"], ["scores", "Class scores"], ["attendance", "Attendance"], ["flashcards", "Flashcards"]]
      .map(([k, l]) => h("button", { class: sub === k ? "on" : "", onclick: () => adminView(me, "teach", { sub: k }) }, l)));
    if (sub === "flashcards") body = [h("h2", {}, "Teach"), pills, ...(await flashAdmin(me))];
    else if (sub === "scores") body = [h("h2", {}, "Teach"), pills, scoresForm(me)];
    else if (sub === "attendance") body = [h("h2", {}, "Teach"), pills, attendanceForm()];
    else if (opt.edit) body = [h("h2", {}, "Teach"), questionForm(opt.edit, () => adminView(me, "teach", { sub: "questions" })), h("button", { class: "ghost full", onclick: () => adminView(me, "teach", { sub: "questions" }) }, "Cancel")];
    else {
      const { data: qs } = await db.from("questions").select("id,course_code,q,options,correct,explanation,week_key").order("course_code").order("seq").limit(150);
      body = [h("h2", {}, "Teach"), pills, bulkQuestionForm(),
        h("details", { class: "card" }, h("summary", {}, "Add one question by typing"), questionForm()),
        h("div", { class: "card" }, h("h3", {}, "Existing questions (" + (qs || []).length + ")"),
          ...((qs || []).length ? qs.map(x => h("div", { style: "margin-bottom:12px" },
            h("p", { style: "margin:0 0 4px" }, h("b", {}, x.course_code), "  ", h("small", {}, weekText(x.week_key)), h("br"), x.q.length > 90 ? x.q.slice(0, 90) + "…" : x.q),
            h("button", { class: "ghost", style: "padding:4px 10px;font-size:13px", onclick: () => adminView(me, "teach", { sub: "questions", edit: x }) }, "Edit"), " ",
            h("button", { class: "ghost", style: "padding:4px 10px;font-size:13px", onclick: async () => {
              if (!confirm("Delete this question?")) return;
              const { error } = await db.from("questions").delete().eq("id", x.id);
              if (error) return alert("Failed: " + error.message);
              adminView(me, "teach", { sub: "questions" });
            } }, "Delete"))) : [h("p", {}, "None yet.")]))];
    }
  } else if (tab === "chat") {
    const { data } = await db.from("messages").select("student_id,tutor_id,sender_role,text,created_at,student:profiles!messages_student_id_fkey(full_name),tutor:profiles!messages_tutor_id_fkey(full_name)").order("created_at", { ascending: false }).limit(300);
    const threads = threadsOf(data);
    body = [h("h2", {}, "Chat"), h("p", {}, h("small", {}, owner ? "You can see every tutor’s conversations as owner." : "These are the conversations students started with you.")),
      ...(threads.length ? threads.map(m => h("div", { class: "card", style: "cursor:pointer", onclick: () => adminThread(me, { id: m.student_id, name: m.student?.full_name || "Student", tutorId: m.tutor_id }) },
        h("h3", {}, (m.student?.full_name || "Student") + (owner && m.tutor_id !== me.id ? "  ·  with " + (m.tutor?.full_name || "tutor") : "")),
        m.sender_role === "student" ? h("span", { class: "pill r" }, "Needs reply") : h("span", { class: "pill g" }, "Replied"),
        h("p", {}, m.text.length > 80 ? m.text.slice(0, 80) + "…" : m.text), h("small", {}, new Date(m.created_at).toLocaleString("en-GB"))))
        : [h("div", { class: "card" }, h("p", {}, "No conversations yet. Students can message you from their Chat tab, or tap Message next to a student in the Students tab."))])];
  } else if (tab === "menu") {
    const tiles = [["materials", "📚", "Materials"], ["leaderboards", "🏆", "Leaderboards"], ["announcements", "📣", "Announcements"], ["analytics", "📈", "Analytics"],
      ["feedback", "💬", "Feedback"], ["homepage", "🏠", "Homepage"], ["account", "⚙️", "Account"]];
    body = [h("h2", {}, "Menu"), h("div", { class: "grid2" }, ...tiles.map(([k, icon, l]) => h("div", { class: "card tile", onclick: () => go(k) }, h("div", {}, icon), h("b", {}, l))))];
  } else if (tab === "materials") { body = await materialsAdmin(me, go);
  } else if (tab === "leaderboards") { body = await leaderboardsAdmin(me, go);
  } else if (tab === "announcements") { body = await announcementsAdmin(me, go);
  } else if (tab === "analytics") { body = await analyticsAdmin(me, go);
  } else if (tab === "feedback") { body = await feedbackAdmin(me, go);
  } else if (tab === "homepage") { body = homepageAdmin(go);
  } else if (tab === "account") { body = accountAdmin(me, go);
  }
  show(navShell(items, menuKeys.includes(tab) ? "menu" : tab, go, ...body));
}

/* ---------- ROUTER ---------- */
async function route() {
  if (recovering) return newPasswordView();
  const { data: { session } } = await db.auth.getSession();
  if (!session) return authView("login");
  const { data: me, error } = await db.from("profiles").select("*").eq("id", session.user.id).single();
  if (error || !me) { await db.auth.signOut(); return authView("login"); }
  me.role === "student" ? studentView(me) : adminView(me);
}
db.auth.onAuthStateChange(ev => { if (ev === "PASSWORD_RECOVERY") { recovering = true; newPasswordView(); } });
route();
</script>
</body>
